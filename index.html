<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1E2B24" />
    <meta name="description" content="Gestão de aulas esportivas, presença e pagamentos" />
    <!-- Preview ao colar um link (WhatsApp, etc.) — como é SPA de página única, esse cartão
         vale pra qualquer rota. Título/descrição cobrem as duas pesquisas que hoje são
         compartilhadas por link (/pesquisa/:token de professor e /pesquisa-socios/:token de
         sócio) — por isso "Pesquisa de Satisfação" sem qualificador de público. Se um link de
         /disponibilidade/:token ou /eventos/:slug for compartilhado, aparece esse mesmo cartão
         (não tem como diferenciar por rota numa SPA sem SSR/edge) — nesses casos o texto fica
         genérico o bastante pra não ficar claramente errado, mas não é ideal. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ProCoach Sport" />
    <meta property="og:title" content="Pesquisa de Satisfação" />
    <meta property="og:description" content="Sua opinião é importante pra gente. Responda em poucos minutos." />
    <meta property="og:image" content="https://procoachsport.com.br/images/macro.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ProCoach" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <title>ProCoach</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
